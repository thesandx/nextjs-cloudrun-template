name: Deploy to Cloud Run

# Fires when code lands on main. `workflow_dispatch` allows a manual redeploy
# of the current main without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you deploying manually?
        required: false
        default: Manual redeploy

# `id-token: write` is what makes keyless auth work: it lets the job mint a
# short-lived GitHub OIDC token that Google exchanges for an access token.
# There is no JSON service account key anywhere in this pipeline, and there
# must never be one — a leaked key is a permanent credential, an OIDC token
# expires in minutes and is scoped to this repository.
permissions:
  contents: read
  id-token: write

# Never run two deploys at once. `cancel-in-progress: false` lets an in-flight
# deploy finish rather than leaving Cloud Run mid-rollout.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  # ---------------------------------------------------------------------------
  # Configure per project. Repository variables (Settings > Secrets and
  # variables > Actions > Variables) override these defaults, so a fork can be
  # retargeted without editing the workflow.
  # ---------------------------------------------------------------------------
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'containers' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || github.event.repository.name }}
  # One slug names the service, the runtime identity, the database and the
  # bucket. Defaults derive from it, so a new app usually sets only APP_SLUG.
  APP_SLUG: ${{ vars.APP_SLUG || vars.CLOUD_RUN_SERVICE || github.event.repository.name }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Attach a GitHub Environment to gate production behind required reviewers
    # and to surface the deployed URL on the repository home page.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify required configuration
        # Fail fast with an actionable message instead of a confusing auth error
        # 3 minutes into the build.
        #
        # Secrets are passed through `env:` rather than interpolated with
        # ${{ }} directly into the script. Interpolation splices the value into
        # the shell source before it runs, so any quote or metacharacter in a
        # secret changes what executes. Reading them as environment variables
        # keeps them as data. Same rule as in .github/instructions/github-workflows.md.
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=0
          for var in GCP_PROJECT_ID WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            if [ -z "${!var:-}" ]; then
              case "$var" in
                GCP_PROJECT_ID)
                  echo "::error::Repository variable ${var} is not set. See cloud/deployment.md." ;;
                *)
                  echo "::error::Secret ${var} is not set. Run scripts/gcp-bootstrap.sh." ;;
              esac
              missing=1
            fi
          done
          exit $missing

      # -----------------------------------------------------------------------
      # Keyless authentication via Workload Identity Federation.
      #
      # Flow: GitHub mints an OIDC JWT describing this workflow run -> the
      # Workload Identity Pool provider validates issuer, audience and the
      # attribute condition pinning it to this repository -> Google returns a
      # federated token -> that token impersonates the deployer service account.
      #
      # Setup is automated in scripts/gcp-bootstrap.sh.
      # -----------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve deploy metadata
        id: meta
        run: |
          set -euo pipefail

          # UTC time of this deploy. /api/health renders it in IST so a deploy
          # is visible without opening GitHub.
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          # Cloud Run revision names must be UNIQUE, and the full name is
          # "<service>-<suffix>" capped at 63 characters. A suffix of the
          # commit SHA alone failed both tests:
          #
          #   - Re-deploying the same commit collided. `gcloud run deploy`
          #     answers ALREADY_EXISTS, so a workflow_dispatch re-run could
          #     never succeed — and re-running a deploy to pick up a changed
          #     repository variable is an ordinary thing to want.
          #   - A 40-character SHA plus a hyphen leaves 22 characters for the
          #     service name. APP_SLUG allows 49, so a longer name overflowed
          #     and the deploy failed on a limit nothing warned about.
          #
          # The RUN NUMBER comes first because it is the uniquifier and must
          # never be truncated. The short SHA follows for readability, and is
          # what gets trimmed when a long service name leaves no room.
          # Traceability does not depend on it: the image tag and the
          # `commit-sha` label both carry the full SHA.
          SUFFIX="r${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          BUDGET=$((63 - ${#SERVICE_NAME} - 1))

          if [[ "$BUDGET" -lt 4 ]]; then
            echo "::error::Service name '${SERVICE_NAME}' (${#SERVICE_NAME} chars) leaves no room for a revision suffix."
            exit 1
          fi
          if [[ "${#SUFFIX}" -gt "$BUDGET" ]]; then
            SUFFIX="${SUFFIX:0:BUDGET}"
          fi

          echo "Revision will be: ${SERVICE_NAME}-${SUFFIX} (${#SERVICE_NAME}+1+${#SUFFIX} chars)"
          echo "revision_suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Resolve data layer names
        id: data
        # Same defaults as lib/env.ts and scripts/gcp-bootstrap.sh. Three places
        # derive these names and they must agree, so each one states the rule
        # rather than assuming another got there first.
        #
        # The overrides come in through `env:` rather than ${{ }} inside the
        # script. Interpolation splices a value into the shell source before it
        # runs, so a stray quote in a repository variable changes what executes.
        # Reading them as environment variables keeps them as data. Same rule as
        # the secrets above, applied for the same reason.
        env:
          DATABASE_ID_OVERRIDE: ${{ vars.FIRESTORE_DATABASE_ID }}
          BUCKET_OVERRIDE: ${{ vars.GCS_BUCKET }}
        run: |
          set -euo pipefail
          echo "database_id=${DATABASE_ID_OVERRIDE:-${APP_SLUG}-db}" >> "$GITHUB_OUTPUT"
          echo "bucket=${BUCKET_OVERRIDE:-${GCP_PROJECT_ID}-${APP_SLUG}-media}" >> "$GITHUB_OUTPUT"

      - name: Deploy Firestore rules and indexes
        # BEFORE the application deploy, deliberately. A revision that queries
        # on an index that does not exist yet fails at request time with
        # FAILED_PRECONDITION; an index nothing queries yet costs nothing. The
        # safe ordering is therefore always indexes first.
        #
        # The script is idempotent: an index that exists is skipped, and the
        # rules are re-released from the file in the repository.
        env:
          DATABASE_ID: ${{ steps.data.outputs.database_id }}
        run: |
          set -euo pipefail
          ./scripts/firestore-deploy.sh \
            --project "${GCP_PROJECT_ID}" \
            --database "${DATABASE_ID}"

      - name: Resolve image tags
        id: image
        # Two tags per build:
        #   :<sha>  immutable, what actually gets deployed and rolled back to
        #   :latest a moving pointer for humans, never referenced by a revision
        run: |
          set -euo pipefail
          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          BASE="${REGISTRY}/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE_NAME}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${BASE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${BASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        # Uses the federated credentials from the auth step — no key file.
        run: gcloud auth configure-docker ${{ steps.image.outputs.registry }} --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64 # Cloud Run gen2 runs amd64
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false # keeps the Artifact Registry listing to one entry
          # NEXT_PUBLIC_* values are inlined into the client bundle at build
          # time, so they belong here and not in env_vars below. Setting one
          # on the Cloud Run service changes nothing until the next build.
          #
          # The Firebase values are repository VARIABLES, not secrets. They are
          # public by design and ship in every bundle; a build arg is the right
          # place for them. Leave them unset and the image builds with sign-in
          # disabled, which closes every write route rather than opening one.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
            NEXT_PUBLIC_APP_NAME=${{ vars.APP_NAME || 'Next.js on Cloud Run' }}
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID || env.GCP_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          # Deploy the immutable SHA tag, never :latest. Deploying a moving tag
          # makes it impossible to tell what a revision is actually running.
          image: ${{ steps.image.outputs.sha_tag }}
          env_vars: |-
            NODE_ENV=production
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
            APP_SLUG=${{ env.APP_SLUG }}
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GCP_REGION=${{ env.GCP_REGION }}
            FIRESTORE_DATABASE_ID=${{ steps.data.outputs.database_id }}
            GCS_BUCKET=${{ steps.data.outputs.bucket }}
            HEALTH_DEEP_CHECKS_ENABLED=${{ vars.HEALTH_DEEP_CHECKS_ENABLED || 'false' }}
            AUTH_SESSION_MAX_AGE_DAYS=${{ vars.AUTH_SESSION_MAX_AGE_DAYS || '14' }}
            AUTH_CHECK_REVOKED=${{ vars.AUTH_CHECK_REVOKED || 'false' }}
            DEPLOYED_AT=${{ steps.meta.outputs.deployed_at }}
          # The runtime identity goes through `flags`, NOT a `service_account`
          # input. This action has no such input: it accepts one and warns
          # `Unexpected input(s) 'service_account'`, then deploys anyway. The
          # warning is easy to miss in a green run, and the revision silently
          # runs as the default compute service account — Editor on the whole
          # project, the opposite of the least-privilege account bootstrap
          # created. Keep this in flags, where gcloud actually reads it.
          flags: >-
            --service-account=${{ vars.RUNTIME_SERVICE_ACCOUNT || format('{0}-runtime@{1}.iam.gserviceaccount.com', env.APP_SLUG, env.GCP_PROJECT_ID) }}
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=${{ vars.MIN_INSTANCES || '0' }}
            --max-instances=${{ vars.MAX_INSTANCES || '10' }}
            --concurrency=80
            --timeout=300
            --execution-environment=gen2
            --cpu-boost
            --revision-suffix=${{ steps.meta.outputs.revision_suffix }}

      - name: Verify the deployment serves traffic
        # The deploy step succeeding only means Cloud Run accepted the revision.
        # Hit the live URL to confirm it is actually healthy before declaring
        # success — this is what turns a green tick into a real signal.
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          echo "Probing ${URL}/api/health"

          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "${URL}/api/health" > /tmp/health.json; then
              echo "Healthy on attempt ${attempt}:"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 5s"
            sleep 5
          done

          echo "::error::Deployed revision never became healthy at ${URL}/api/health"
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${GCP_REGION}" \
            --format='value(status.conditions)'
          exit 1

      # -----------------------------------------------------------------------
      # Firebase Hosting sits in front of Cloud Run when a custom domain is in
      # use, and it is a CDN. Next.js marks a statically prerendered page
      # `Cache-Control: s-maxage=31536000` — one year to a shared cache — so
      # Hosting keeps serving the OLD page after a Cloud Run deploy. Nothing
      # connects the two systems; the deploy does not purge anything.
      #
      # `firebase deploy --only hosting` is that purge. It re-publishes the
      # Hosting release and invalidates the edge, in seconds, without touching
      # the Cloud Run service.
      #
      # ORDER MATTERS. This runs AFTER the health probe, never before: purging
      # while the old revision is still serving simply re-caches the old page.
      #
      # Opt-in, because an app with no Hosting site would fail here. Set the
      # variable once Hosting is live:
      #   gh variable set FIREBASE_HOSTING_ENABLED --body true
      # -----------------------------------------------------------------------
      - name: Purge the Firebase Hosting CDN
        if: vars.FIREBASE_HOSTING_ENABLED == 'true'
        env:
          # firebase-tools reads Application Default Credentials, which
          # google-github-actions/auth already exported for this job. No token,
          # no key file — the same keyless path as every other step here.
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || env.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ ! -f firebase.json ]]; then
            echo "::error::FIREBASE_HOSTING_ENABLED is true but firebase.json is missing."
            exit 1
          fi
          npx --yes firebase-tools@15.31.0 deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --message "Cloud Run ${GITHUB_SHA}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloud Run deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Service | \`${SERVICE_NAME}\` |"
            echo "| Region | \`${GCP_REGION}\` |"
            echo "| Project | \`${GCP_PROJECT_ID}\` |"
            echo "| Image | \`${{ steps.image.outputs.sha_tag }}\` |"
            echo "| Database | \`${{ steps.data.outputs.database_id }}\` |"
            echo "| Bucket | \`gs://${{ steps.data.outputs.bucket }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Hosting purge | ${{ vars.FIREBASE_HOSTING_ENABLED == 'true' && 'yes' || 'skipped (FIREBASE_HOSTING_ENABLED unset)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
