name: PR Validation

# Runs on every pull request into main, and on direct pushes to main as a
# safety net. Nothing here touches Google Cloud, so no job needs cloud
# credentials at all — keep it that way. The `emulator` job installs the gcloud
# SDK, but only to get the local Firestore emulator; it never authenticates.
# This is what lets a pull request from a fork run the full validation.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

# A new push to the same PR cancels the previous run. Saves minutes and stops
# a stale run from reporting after a newer one.
concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Lint, build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Version comes from the `packageManager` field in package.json, so
          # local, CI and Docker all agree without a second place to update.
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails if pnpm-lock.yaml disagrees with package.json,
        # which catches a manually edited manifest before it reaches main.
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        # Build runs BEFORE typecheck on purpose: `next build` generates
        # next-env.d.ts and .next/types/**, which `tsc --noEmit` needs in order
        # to resolve JSX and typed routes. Reversing the order breaks on a
        # clean checkout.
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_NAME: ${{ vars.APP_NAME || 'Next.js on Cloud Run' }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}

      - name: Type check
        run: pnpm typecheck

      - name: Test
        # No tests yet in a fresh project? Vitest exits 0 on an empty run via
        # `passWithNoTests`, so this stays green until real tests land.
        #
        # The `*.emulator.test.ts` suites SKIP here, because
        # FIRESTORE_EMULATOR_HOST is unset. They run in the `emulator` job
        # below, which is not optional.
        run: pnpm test --passWithNoTests

  emulator:
    name: Firestore emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A suite that skips everywhere is a suite nobody runs. This job is the one
    # place the repository helper meets a real Firestore, so it stays a required
    # check. It still needs NO cloud credentials: the emulator is a local Java
    # process that never talks to Google, which is what keeps fork PRs working.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        # The Firestore emulator is a Java process and refuses to start on
        # anything below 21. ubuntu-latest ships an older default JDK, so
        # without this the emulator exits before it binds a port.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Cloud SDK
        # Installs gcloud and the emulator component. No `auth` step precedes
        # it, on purpose — installing the SDK needs no identity.
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-firestore-emulator

      - name: Run emulator suites
        # Starts the emulator, runs the suites against it, stops it again.
        run: pnpm test:emulator

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        # Proves the production image still builds on every PR. Nothing is
        # pushed — a broken Dockerfile should fail review, not deploy day.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ github.event.repository.name }}:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}

      - name: Smoke test the container
        # Boots the real image and waits for the health endpoint. Catches the
        # classic failures a build alone cannot: wrong PORT, binding to
        # localhost instead of 0.0.0.0, missing static assets, permission
        # errors from running as a non-root user.
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.repository.name }}:pr-${{ github.sha }}"
          # The data-layer variables are required in production, so the
          # container refuses to start without them. Placeholder values are
          # enough: the smoke test probes /api/health, which is deliberately
          # dependency-free and never opens a connection to either service.
          docker run -d --name smoke -p 8080:8080 \
            -e PORT=8080 \
            -e APP_SLUG=smoke-test \
            -e GCP_PROJECT_ID=smoke-test-project \
            -e FIRESTORE_DATABASE_ID=smoke-test-db \
            -e GCS_BUCKET=smoke-test-project-smoke-test-media \
            "$IMAGE"

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "Health check passed on attempt ${attempt}"
              curl -fsS http://localhost:8080/api/health
              docker rm -f smoke > /dev/null
              exit 0
            fi
            sleep 2
          done

          echo "::error::Container did not become healthy within 60s"
          docker logs smoke
          docker rm -f smoke > /dev/null
          exit 1
